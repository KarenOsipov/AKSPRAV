<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АГРО КУРС — Справочник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy: #23245B;
    --navy-light: #34366F;
    --navy-lighter: #454785;
    --red: #C81225;
    --red-deep: #96101F;
    --bg: #F3F4F8;
    --surface: #FFFFFF;
    --line: #E1E3EA;
    --ink: #1B1E2A;
    --ink-soft: #6B7080;
    --ink-faint: #9A9EAD;
    --radius: 12px;
    --radius-sm: 8px;
  }
  *{ box-sizing: border-box; min-width:0; }
  html,body{ height:100%; }
  body{
    margin:0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif; font-size: 15px; line-height: 1.6;
    overflow-wrap: anywhere;
  }
  h1,h2,h3, .brand{ font-family: 'Manrope', system-ui, sans-serif; font-weight: 700; }
  button, input, textarea, select{ font-family: inherit; font-size: inherit; color: inherit; }
  ::selection{ background: var(--red); color:#fff; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
  .hidden{ display:none !important; }

  /* ---------- LOGO ---------- */
  .logo-wrap img{ height:74px; width:auto; object-fit:contain; display:block; }
  .sidebar-logo img{ height:56px; width:auto; object-fit:contain; display:block; }

  /* ---------- LOGIN ---------- */
  #login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding: 24px; background: var(--bg); }
  .login-card{
    width:100%; max-width: 380px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 34px 32px 32px; box-shadow: 0 8px 28px rgba(35,36,91,0.08);
    animation: cardIn .45s cubic-bezier(.2,.8,.3,1.1) both;
  }
  @keyframes cardIn{ 0%{ opacity:0; transform: translateY(8px) scale(.98); } 100%{ opacity:1; transform:none; } }
  .logo-wrap{ display:flex; justify-content:center; margin-bottom: 20px; }
  .brand-sub{ color: var(--ink-soft); font-size: 13px; text-align:center; margin: 0 0 28px; }
  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-size: 13px; color: var(--ink-soft); margin-bottom: 6px; font-weight:500; }
  .field input{ width:100%; padding: 11px 13px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius-sm); outline: none; }
  .field input:focus{ border-color: var(--red); box-shadow: 0 0 0 3px rgba(200,18,37,0.12); }
  .btn{ border:none; cursor:pointer; border-radius: var(--radius-sm); padding: 11px 18px; font-size: 14.5px; font-weight: 600; transition: background .15s ease, border-color .15s ease, color .15s ease, transform .1s ease; }
  .btn:active{ transform: scale(.98); }
  .btn:focus-visible{ outline: 2px solid var(--navy); outline-offset: 2px; }
  .btn-primary{ background: var(--red); color:#fff; width:100%; }
  .btn-primary:hover{ background: var(--red-deep); }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ background: var(--bg); color: var(--ink); }
  .btn-small{ padding: 7px 12px; font-size: 13px; }
  .form-msg{ font-size: 13.5px; margin: 14px 0 0; }
  .form-msg.error{ color: var(--red); }
  .form-msg.ok{ color: #1B7A4A; }

  /* ---------- APP SHELL ---------- */
  #app-screen{ display:flex; min-height:100vh; }
  .sidebar{ width: 264px; flex-shrink:0; background: var(--navy); display:flex; flex-direction:column; padding: 20px 18px; }
  .sidebar-logo{ background:#fff; border-radius: var(--radius); padding: 16px; display:flex; justify-content:center; margin-bottom: 22px; }
  .nav-list{ list-style:none; margin:0 0 8px; padding:0; flex:1; overflow-y:auto; }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: 11px 12px; margin-bottom: 3px; cursor:pointer; border-radius: var(--radius-sm);
    color: rgba(255,255,255,0.72); border-left: 3px solid transparent;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .nav-item:hover{ background: var(--navy-light); color:#fff; }
  .nav-item.active{ background: var(--navy-light); color:#fff; border-left-color: var(--red); font-weight:600; }
  .nav-item span:first-child{ overflow-wrap: anywhere; }
  .nav-item .count{ font-size:12px; color: rgba(255,255,255,0.5); flex-shrink:0; }
  .nav-item .del-cat{ opacity:0; font-size:12px; color:#F5A3AB; background:none; border:none; cursor:pointer; padding:2px 4px; flex-shrink:0; }
  .nav-item:hover .del-cat{ opacity:1; }
  .sidebar-foot{ border-top: 1px solid rgba(255,255,255,0.12); padding-top:14px; }
  .who{ font-size:12.5px; color: rgba(255,255,255,0.55); margin-bottom:10px; }
  .add-cat-row{ display:flex; gap:6px; margin-bottom:10px; }
  .add-cat-row input{ flex:1; min-width:0; padding:8px 10px; border:1px solid rgba(255,255,255,0.2); border-radius: var(--radius-sm); background: var(--navy-light); color:#fff; }
  .add-cat-row input::placeholder{ color: rgba(255,255,255,0.45); }
  .add-cat-row .btn{ background: var(--red); color:#fff; flex-shrink:0; }
  .sidebar-foot .btn-ghost{ width:100%; color: rgba(255,255,255,0.75); border-color: rgba(255,255,255,0.2); }
  .sidebar-foot .btn-ghost:hover{ background: var(--navy-light); color:#fff; }

  .main{ flex:1; min-width:0; padding: 28px 36px 60px; max-width: 1040px; margin:0 auto; width:100%; }
  .topbar{ display:flex; gap:14px; align-items:center; margin-bottom: 22px; flex-wrap:wrap; }
  .search-wrap{ position:relative; flex:1; min-width:220px; }
  .search-wrap input{ width:100%; padding: 12px 16px; border:1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .search-wrap input:focus{ outline:none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(200,18,37,0.1); }

  .panel{ background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 28px; animation: fadeIn .25s ease both; }
  @keyframes fadeIn{ from{ opacity:0; transform: translateY(4px);} to{ opacity:1; transform:none; } }

  .crumb{ font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; cursor:pointer; display:inline-block; }
  .crumb:hover{ color: var(--red); }

  .section-title{ font-size: 22px; margin: 0 0 4px; }
  .section-hint{ color: var(--ink-soft); font-size: 13.5px; margin: 0 0 18px; }

  /* ---------- ГЛАВНЫЙ ЭКРАН: онбординг + карточки разделов ---------- */
  .intro-panel{ margin-bottom: 20px; }
  .intro-panel .section-hint{ max-width: 62ch; margin-bottom: 22px; }
  .steps-row{ display:flex; gap:22px; flex-wrap:wrap; }
  .step-item{ display:flex; gap:12px; align-items:flex-start; flex:1; min-width:200px; }
  .step-num{ width:26px; height:26px; border-radius:50%; background: var(--bg); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12.5px; color: var(--navy); flex-shrink:0; }
  .step-text{ font-size:13.5px; color: var(--ink-soft); padding-top:3px; }
  .cat-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(210px,1fr)); gap:14px; }
  .cat-card{ background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; cursor:pointer; transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
  .cat-card:hover{ border-color: var(--navy-lighter); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(35,36,91,0.09); }
  .cat-badge{ width:38px; height:38px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; margin-bottom:14px; font-family:'Manrope',sans-serif; font-size:15px; }
  .cat-card-name{ font-weight:700; margin-bottom:4px; }
  .cat-card-count{ font-size:12.5px; color: var(--ink-soft); }

  .article-row{
    display:flex; justify-content:space-between; align-items:center; gap:14px;
    padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius-sm);
    cursor:pointer; margin-bottom: 10px; transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .article-row:hover{ border-color: var(--navy-lighter); background: var(--bg); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(35,36,91,0.06); }
  .article-row:hover .art-title{ color: var(--red); }
  .art-row-left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .art-thumb{ width:44px; height:44px; border-radius: 8px; object-fit:cover; flex-shrink:0; background: var(--bg); border:1px solid var(--line); }
  .art-title{ font-weight:600; transition: color .12s ease; }
  .art-meta{ font-size:12.5px; color: var(--ink-soft); margin-top:3px; }
  .art-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{ background:none; border:1px solid var(--line); border-radius: var(--radius-sm); width:30px; height:30px; cursor:pointer; color: var(--ink-soft); font-size:14px; flex-shrink:0; }
  .icon-btn:hover{ background: var(--bg); color: var(--ink); }
  .icon-btn.danger:hover{ color: var(--red); border-color: var(--red); }

  .article-cover{ width:100%; max-height: 340px; object-fit:cover; border-radius: var(--radius); margin-bottom:22px; display:block; }
  .article-detail h2{ font-size: 27px; margin: 4px 0 6px; line-height:1.25; }
  .article-detail .art-meta{ margin-bottom: 16px; }
  .article-audio{ width:100%; margin: 4px 0 20px; }
  .article-body{ white-space: pre-wrap; font-size: 16px; max-width: 68ch; color:#282B39; }
  .tag-pill{ display:inline-block; font-size:12px; color: var(--navy); background: var(--bg); border:1px solid var(--line); padding:3px 10px; border-radius: 20px; margin: 0 6px 6px 0; font-weight:500; }

  .empty-state{ padding: 20px 0; color: var(--ink-soft); }
  .empty-state p{ margin: 0 0 14px; }

  .editor .field label{ font-weight:500; }
  .editor textarea{ width:100%; min-height:220px; padding:12px 13px; border:1px solid var(--line); border-radius: var(--radius-sm); resize:vertical; background: var(--surface); }
  .editor textarea:focus, .editor select:focus{ outline:none; border-color: var(--red); box-shadow: 0 0 0 3px rgba(200,18,37,0.1); }
  .editor select{ width:100%; padding:11px 13px; border:1px solid var(--line); border-radius: var(--radius-sm); background:var(--surface); }
  .editor-actions{ display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .media-field{ border:1px dashed var(--line); border-radius: var(--radius-sm); padding: 14px; }
  .media-field + .media-field{ margin-top:14px; }
  .media-preview-img{ max-width:200px; max-height:140px; border-radius:8px; display:block; margin-top:10px; object-fit:cover; }
  .media-preview-audio{ width:100%; margin-top:10px; }
  .rec-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; background: var(--red); margin-right:6px; animation: pulse 1s ease infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:.3; } }
  .file-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .file-row input[type=file]{ font-size:13px; max-width:100%; }

  @media (max-width: 780px){
    #app-screen{ flex-direction:column; }
    .sidebar{ width:100%; }
    .main{ padding: 20px 16px 50px; }
  }
</style>
</head>
<body>

<!-- ============== ЭКРАН ВХОДА ============== -->
<div id="login-screen">
  <div class="login-card">
    <div class="logo-wrap">
      <img src="agrokurs-logo.png" alt="Агро Курс" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'brand',textContent:'АГРО КУРС',style:'font-size:22px;color:var(--navy)'}))">
    </div>
    <p class="brand-sub">Справочник для сотрудников</p>
    <div class="field">
      <label for="login-email">Рабочая почта</label>
      <input id="login-email" type="email" autocomplete="username" placeholder="ivan@agrokurs.kz">
    </div>
    <div class="field">
      <label for="login-pass">Пароль</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary" id="login-btn">Войти</button>
    <p class="form-msg" id="login-msg"></p>
  </div>
</div>

<!-- ============== ОСНОВНОЕ ПРИЛОЖЕНИЕ ============== -->
<div id="app-screen" class="hidden">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="agrokurs-logo.png" alt="Агро Курс" onerror="this.parentElement.remove()">
    </div>
    <ul class="nav-list" id="nav-list"></ul>
    <div class="sidebar-foot">
      <div class="who" id="who-am-i"></div>
      <div id="add-cat-zone"></div>
      <button class="btn btn-ghost btn-small" id="logout-btn">Выйти</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Найти инструкцию, правило, контакт…">
      </div>
      <button class="btn btn-small hidden" id="add-article-btn" style="background:var(--red); color:#fff; flex-shrink:0;">+ Добавить статью</button>
    </div>
    <div id="main-view"></div>
  </main>
</div>

<script>
/* =========================================================================
   НАСТРОЙКА: вставьте сюда данные вашего проекта Supabase (см. README.md)
   ========================================================================= */
const SUPABASE_URL = "https://iateslqjjrdzkcifvfje.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhdGVzbHFqanJkemtjaWZ2ZmplIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNjUxOTIsImV4cCI6MjEwMzc0MTE5Mn0.b4dy8NH4--AmHr95IkDXhdiGyU-pjd8PYOtE2EZyzBw";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const MEDIA_BUCKET = "media";

/* ---------------------------- state ---------------------------- */
const state = {
  session: null,
  profile: null,
  categories: [],
  articles: [],
  activeCategoryId: null,
  activeArticleId: null,
  searchQuery: "",
  editing: null,
};

const $ = (sel) => document.querySelector(sel);
const loginScreen = $("#login-screen");
const appScreen = $("#app-screen");

/* ---------------------------- auth ---------------------------- */
$("#login-btn").addEventListener("click", doLogin);
$("#login-pass").addEventListener("keydown", (e) => { if(e.key === "Enter") doLogin(); });

async function doLogin(){
  const email = $("#login-email").value.trim();
  const password = $("#login-pass").value;
  const msg = $("#login-msg");
  msg.textContent = ""; msg.className = "form-msg";
  if(!email || !password){ msg.textContent = "Введите почту и пароль."; msg.classList.add("error"); return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    msg.textContent = "Неверная почта или пароль. Проверьте данные и попробуйте снова.";
    msg.classList.add("error");
    return;
  }
  await onLoggedIn(data.session);
}

$("#logout-btn").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });

async function onLoggedIn(session){
  state.session = session;
  const { data: profile, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if(error){ console.error(error); }
  state.profile = profile || { role: "employee", full_name: session.user.email };
  loginScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");
  $("#who-am-i").textContent = (state.profile.full_name || session.user.email) +
    (state.profile.role === "admin" ? " · администратор" : "");
  if(state.profile.role === "admin"){
    $("#add-article-btn").classList.remove("hidden");
    renderAddCategoryZone();
  }
  await loadData();
}

async function loadData(){
  const [{ data: cats }, { data: arts }] = await Promise.all([
    sb.from("categories").select("*").order("sort_order", { ascending: true }),
    sb.from("articles").select("*").order("created_at", { ascending: false }),
  ]);
  state.categories = cats || [];
  state.articles = arts || [];
  render();
}

/* ---------------------------- media helpers ---------------------------- */
async function uploadMedia(fileOrBlob, folder, ext){
  const path = `${folder}/${crypto.randomUUID()}.${ext}`;
  const { error } = await sb.storage.from(MEDIA_BUCKET).upload(path, fileOrBlob, { upsert: false });
  if(error) throw error;
  return path;
}
async function getSignedUrl(path){
  if(!path) return null;
  const { data, error } = await sb.storage.from(MEDIA_BUCKET).createSignedUrl(path, 3600);
  if(error){ console.error(error); return null; }
  return data.signedUrl;
}
async function hydrateMedia(root){
  const els = root.querySelectorAll("[data-media-path]");
  for(const el of els){
    const path = el.dataset.mediaPath;
    const url = await getSignedUrl(path);
    if(!url) continue;
    if(el.tagName === "IMG") el.src = url;
    if(el.tagName === "AUDIO") el.src = url;
    el.removeAttribute("data-media-path");
  }
}

/* ---------------------------- render: sidebar ---------------------------- */
function renderAddCategoryZone(){
  const zone = $("#add-cat-zone");
  zone.innerHTML = `
    <div class="add-cat-row">
      <input id="new-cat-name" type="text" placeholder="Новый раздел…">
      <button class="btn btn-small" id="new-cat-btn">+</button>
    </div>`;
  $("#new-cat-btn").addEventListener("click", async () => {
    const name = $("#new-cat-name").value.trim();
    if(!name) return;
    const { error } = await sb.from("categories").insert({ name, sort_order: state.categories.length + 1 });
    if(!error){ $("#new-cat-name").value = ""; await loadData(); }
  });
}

function renderSidebar(){
  const list = $("#nav-list");
  const isAdmin = state.profile && state.profile.role === "admin";
  list.innerHTML = state.categories.map(cat => {
    const count = state.articles.filter(a => a.category_id === cat.id).length;
    const active = state.activeCategoryId === cat.id && !state.searchQuery && !state.activeArticleId;
    return `
      <li class="nav-item ${active ? "active" : ""}" data-cat="${cat.id}">
        <span>${escapeHtml(cat.name)}</span>
        <span style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
          <span class="count">${count}</span>
          ${isAdmin ? `<button class="del-cat" data-delcat="${cat.id}" title="Удалить раздел">✕</button>` : ""}
        </span>
      </li>`;
  }).join("");

  list.querySelectorAll(".nav-item").forEach(el => {
    el.addEventListener("click", (e) => {
      if(e.target.closest("[data-delcat]")) return;
      state.activeCategoryId = el.dataset.cat;
      state.activeArticleId = null;
      state.searchQuery = "";
      $("#search-input").value = "";
      render();
    });
  });
  list.querySelectorAll("[data-delcat]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      if(!confirm("Удалить этот раздел? Статьи внутри останутся без раздела.")) return;
      await sb.from("categories").delete().eq("id", el.dataset.delcat);
      await loadData();
    });
  });
}

/* ---------------------------- render: main area ---------------------------- */
$("#search-input").addEventListener("input", (e) => {
  state.searchQuery = e.target.value.trim();
  state.activeArticleId = null;
  render();
});

$("#add-article-btn").addEventListener("click", () => {
  state.editing = { data: { title:"", content:"", tags:"", category_id: state.activeCategoryId || (state.categories[0] && state.categories[0].id) || "" } };
  state.activeArticleId = null;
  render();
});

function pluralArticles(n){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 >= 11 && mod100 <= 14) return "статей";
  if(mod10 === 1) return "статья";
  if(mod10 >= 2 && mod10 <= 4) return "статьи";
  return "статей";
}

function render(){
  renderSidebar();
  const view = $("#main-view");
  const isAdmin = state.profile && state.profile.role === "admin";

  if(state.editing){
    view.innerHTML = `<div class="panel">${renderEditor(state.editing, isAdmin)}</div>`;
    attachEditorHandlers();
    return;
  }

  if(state.activeArticleId){
    const a = state.articles.find(x => x.id === state.activeArticleId);
    if(!a){ state.activeArticleId = null; return render(); }
    const cat = state.categories.find(c => c.id === a.category_id);
    const backLabel = state.searchQuery ? "Результаты поиска" : (cat ? cat.name : "Все статьи");
    view.innerHTML = `
      <div class="panel article-detail">
        <div class="crumb" id="back-to-cat">← ${escapeHtml(backLabel)}</div>
        ${a.image_path ? `<img class="article-cover" data-media-path="${a.image_path}" alt="">` : ""}
        <h2>${escapeHtml(a.title)}</h2>
        <div class="art-meta">Обновлено ${formatDate(a.updated_at || a.created_at)}</div>
        <div>${(a.tags||[]).map(t => `<span class="tag-pill">${escapeHtml(t)}</span>`).join("")}</div>
        ${a.audio_path ? `<audio class="article-audio" controls data-media-path="${a.audio_path}"></audio>` : ""}
        <div class="article-body">${escapeHtml(a.content)}</div>
        ${isAdmin ? `
          <div class="editor-actions">
            <button class="btn btn-ghost btn-small" id="edit-this">Редактировать</button>
            <button class="btn btn-ghost btn-small" id="delete-this" style="color:var(--red); border-color:var(--red);">Удалить</button>
          </div>` : ""}
      </div>`;
    hydrateMedia(view);
    $("#back-to-cat").addEventListener("click", () => { state.activeArticleId = null; render(); });
    if(isAdmin){
      $("#edit-this").addEventListener("click", () => {
        state.editing = { data: { ...a, tags: (a.tags||[]).join(", ") } };
        render();
      });
      $("#delete-this").addEventListener("click", async () => {
        if(!confirm("Удалить эту статью без возможности восстановления?")) return;
        await sb.from("articles").delete().eq("id", a.id);
        state.activeArticleId = null;
        await loadData();
      });
    }
    return;
  }

  if(state.searchQuery){
    const q = state.searchQuery.toLowerCase();
    const results = state.articles.filter(a =>
      a.title.toLowerCase().includes(q) ||
      (a.content || "").toLowerCase().includes(q) ||
      (a.tags || []).some(t => t.toLowerCase().includes(q))
    );
    view.innerHTML = `
      <div class="panel">
        <h2 class="section-title">Результаты поиска</h2>
        <p class="section-hint">По запросу «${escapeHtml(state.searchQuery)}» найдено: ${results.length}</p>
        ${results.length ? results.map(a => articleRowHtml(a, isAdmin)).join("") :
          `<div class="empty-state"><p>Ничего не найдено. Попробуйте другое слово или посмотрите разделы в списке слева.</p></div>`}
      </div>`;
    attachRowHandlers();
    hydrateMedia(view);
    return;
  }

  if(state.activeCategoryId){
    const cat = state.categories.find(c => c.id === state.activeCategoryId);
    const list = state.articles.filter(a => a.category_id === state.activeCategoryId);
    view.innerHTML = `
      <div class="panel">
        <h2 class="section-title">${cat ? escapeHtml(cat.name) : "Раздел"}</h2>
        <p class="section-hint">${list.length ? `Статей в разделе: ${list.length}` : "Пока пусто"}</p>
        ${list.length ? list.map(a => articleRowHtml(a, isAdmin)).join("") :
          `<div class="empty-state"><p>В этом разделе пока нет статей.</p>
            ${isAdmin ? `<button class="btn btn-ghost btn-small" id="add-first">Добавить первую статью</button>` : ""}
          </div>`}
      </div>`;
    attachRowHandlers();
    hydrateMedia(view);
    if(isAdmin && !list.length){
      $("#add-first")?.addEventListener("click", () => $("#add-article-btn").click());
    }
    return;
  }

  // ---------- Главный экран: онбординг + карточки разделов ----------
  const stepsHtml = `
    <div class="steps-row">
      <div class="step-item"><div class="step-num">1</div><div class="step-text">Ищите через строку поиска сверху — по названию, тексту статьи или тегам.</div></div>
      <div class="step-item"><div class="step-num">2</div><div class="step-text">Или открывайте нужный раздел — слева в меню или в карточках ниже.</div></div>
      <div class="step-item"><div class="step-num">3</div><div class="step-text">Не нашли ответ — обратитесь к администратору справочника.</div></div>
    </div>`;

  const cardsHtml = state.categories.length ? `
    <div class="cat-grid">
      ${state.categories.map((cat, i) => {
        const count = state.articles.filter(a => a.category_id === cat.id).length;
        const letter = (cat.name.trim()[0] || "?").toUpperCase();
        const bg = i % 2 === 0 ? "var(--navy)" : "var(--red)";
        return `
          <div class="cat-card" data-cat="${cat.id}">
            <div class="cat-badge" style="background:${bg};">${escapeHtml(letter)}</div>
            <div class="cat-card-name">${escapeHtml(cat.name)}</div>
            <div class="cat-card-count">${count} ${pluralArticles(count)}</div>
          </div>`;
      }).join("")}
    </div>` : `<div class="panel"><p class="section-hint" style="margin:0;">Разделов пока нет${isAdmin ? " — добавьте первый раздел внизу левой панели." : "."}</p></div>`;

  view.innerHTML = `
    <div class="panel intro-panel">
      <h2 class="section-title">Добро пожаловать в справочник АГРО КУРС</h2>
      <p class="section-hint">Здесь собраны правила, инструкции и контакты компании — чтобы быстро понять, что делать, как сделать это правильно и к кому обратиться, если что-то непонятно.</p>
      ${stepsHtml}
    </div>
    ${cardsHtml}`;

  document.querySelectorAll(".cat-card").forEach(el => {
    el.addEventListener("click", () => { state.activeCategoryId = el.dataset.cat; render(); });
  });
}

function articleRowHtml(a, isAdmin){
  const cat = state.categories.find(c => c.id === a.category_id);
  return `
    <div class="article-row" data-open="${a.id}">
      <div class="art-row-left">
        ${a.image_path ? `<img class="art-thumb" data-media-path="${a.image_path}" alt="">` : ""}
        <div>
          <div class="art-title">${escapeHtml(a.title)}</div>
          <div class="art-meta">${cat ? escapeHtml(cat.name) + " · " : ""}${formatDate(a.updated_at || a.created_at)}${a.audio_path ? " · 🎤 голосовое" : ""}</div>
        </div>
      </div>
      ${isAdmin ? `
        <div class="art-actions">
          <button class="icon-btn" data-edit="${a.id}" title="Редактировать">✎</button>
          <button class="icon-btn danger" data-del="${a.id}" title="Удалить">🗑</button>
        </div>` : ""}
    </div>`;
}

function attachRowHandlers(){
  document.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", (e) => {
      if(e.target.closest("[data-edit],[data-del]")) return;
      state.activeArticleId = el.dataset.open;
      render();
    });
  });
  document.querySelectorAll("[data-edit]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const a = state.articles.find(x => x.id === el.dataset.edit);
      state.editing = { data: { ...a, tags: (a.tags||[]).join(", ") } };
      render();
    });
  });
  document.querySelectorAll("[data-del]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      if(!confirm("Удалить эту статью без возможности восстановления?")) return;
      await sb.from("articles").delete().eq("id", el.dataset.del);
      await loadData();
    });
  });
}

/* ---------------------------- editor ---------------------------- */
let mediaRecorder = null, recordedChunks = [];

function renderEditor(editing, isAdmin){
  if(!isAdmin) return "";
  const d = editing.data;
  const isNew = !d.id;
  const catOptions = state.categories.map(c =>
    `<option value="${c.id}" ${c.id === d.category_id ? "selected":""}>${escapeHtml(c.name)}</option>`).join("");
  return `
    <h2 class="section-title">${isNew ? "Новая статья" : "Редактирование статьи"}</h2>
    <div class="editor">
      <div class="field">
        <label>Заголовок</label>
        <input id="ed-title" type="text" value="${escapeAttr(d.title||"")}" placeholder="Например: Порядок выдачи топливных карт">
      </div>
      <div class="field">
        <label>Раздел</label>
        <select id="ed-cat">${catOptions}</select>
      </div>
      <div class="field">
        <label>Теги через запятую (для поиска)</label>
        <input id="ed-tags" type="text" value="${escapeAttr(d.tags||"")}" placeholder="топливо, автопарк, снабжение">
      </div>
      <div class="field">
        <label>Текст статьи</label>
        <textarea id="ed-content" placeholder="Подробное описание, шаги, контакты…">${escapeHtml(d.content||"")}</textarea>
      </div>

      <div class="media-field">
        <label style="font-weight:500; display:block; margin-bottom:8px;">Фото к статье (необязательно)</label>
        <div class="file-row">
          <input type="file" id="ed-image-file" accept="image/*">
          <button type="button" class="btn btn-ghost btn-small hidden" id="ed-image-remove">Убрать фото</button>
        </div>
        <img id="ed-image-preview" class="media-preview-img hidden" alt="">
      </div>

      <div class="media-field">
        <label style="font-weight:500; display:block; margin-bottom:8px;">Голосовое сообщение (необязательно)</label>
        <div class="file-row">
          <button type="button" class="btn btn-ghost btn-small" id="rec-start">● Записать с микрофона</button>
          <button type="button" class="btn btn-ghost btn-small hidden" id="rec-stop">Остановить запись</button>
          <span id="rec-status" style="font-size:13px; color:var(--ink-soft);"></span>
        </div>
        <div class="file-row" style="margin-top:10px;">
          <span style="font-size:13px; color:var(--ink-soft);">или загрузить файл:</span>
          <input type="file" id="ed-audio-file" accept="audio/*">
          <button type="button" class="btn btn-ghost btn-small hidden" id="ed-audio-remove">Убрать запись</button>
        </div>
        <audio id="ed-audio-preview" class="media-preview-audio hidden" controls></audio>
      </div>

      <div class="editor-actions">
        <button class="btn" style="background:var(--red); color:#fff;" id="ed-save">Сохранить</button>
        <button class="btn btn-ghost btn-small" id="ed-cancel">Отмена</button>
      </div>
      <p class="form-msg" id="ed-msg"></p>
    </div>`;
}

async function attachEditorHandlers(){
  const editing = state.editing;
  const d = editing.data;

  if(d.image_path){
    const url = await getSignedUrl(d.image_path);
    if(url){ $("#ed-image-preview").src = url; $("#ed-image-preview").classList.remove("hidden"); $("#ed-image-remove").classList.remove("hidden"); }
  }
  if(d.audio_path){
    const url = await getSignedUrl(d.audio_path);
    if(url){ $("#ed-audio-preview").src = url; $("#ed-audio-preview").classList.remove("hidden"); $("#ed-audio-remove").classList.remove("hidden"); }
  }

  $("#ed-cancel").addEventListener("click", () => { state.editing = null; render(); });

  $("#ed-image-file").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    editing.pendingImageFile = file;
    editing.removeImage = false;
    const url = URL.createObjectURL(file);
    $("#ed-image-preview").src = url;
    $("#ed-image-preview").classList.remove("hidden");
    $("#ed-image-remove").classList.remove("hidden");
  });
  $("#ed-image-remove").addEventListener("click", () => {
    editing.pendingImageFile = null; editing.removeImage = true;
    $("#ed-image-file").value = "";
    $("#ed-image-preview").classList.add("hidden");
    $("#ed-image-remove").classList.add("hidden");
  });

  $("#ed-audio-file").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if(!file) return;
    editing.pendingAudioBlob = file;
    editing.removeAudio = false;
    const url = URL.createObjectURL(file);
    $("#ed-audio-preview").src = url;
    $("#ed-audio-preview").classList.remove("hidden");
    $("#ed-audio-remove").classList.remove("hidden");
  });
  $("#ed-audio-remove").addEventListener("click", () => {
    editing.pendingAudioBlob = null; editing.removeAudio = true;
    $("#ed-audio-file").value = "";
    $("#ed-audio-preview").classList.add("hidden");
    $("#ed-audio-remove").classList.add("hidden");
  });

  $("#rec-start").addEventListener("click", async () => {
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: "audio/webm" });
        editing.pendingAudioBlob = blob; editing.removeAudio = false;
        const url = URL.createObjectURL(blob);
        $("#ed-audio-preview").src = url;
        $("#ed-audio-preview").classList.remove("hidden");
        $("#ed-audio-remove").classList.remove("hidden");
        stream.getTracks().forEach(t => t.stop());
      };
      mediaRecorder.start();
      $("#rec-start").classList.add("hidden");
      $("#rec-stop").classList.remove("hidden");
      $("#rec-status").innerHTML = `<span class="rec-dot"></span>Идёт запись…`;
    }catch(err){
      $("#rec-status").textContent = "Не удалось получить доступ к микрофону: " + err.message;
    }
  });
  $("#rec-stop").addEventListener("click", () => {
    if(mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    $("#rec-start").classList.remove("hidden");
    $("#rec-stop").classList.add("hidden");
    $("#rec-status").textContent = "Запись готова.";
  });

  $("#ed-save").addEventListener("click", async () => {
    const title = $("#ed-title").value.trim();
    const category_id = $("#ed-cat").value;
    const tags = $("#ed-tags").value.split(",").map(t => t.trim()).filter(Boolean);
    const content = $("#ed-content").value.trim();
    const msg = $("#ed-msg");
    if(!title || !content){
      msg.textContent = "Заполните заголовок и текст статьи."; msg.className = "form-msg error"; return;
    }
    msg.textContent = "Сохраняем…"; msg.className = "form-msg";
    $("#ed-save").disabled = true;

    try{
      const payload = { title, category_id, tags, content, updated_at: new Date().toISOString() };

      if(editing.removeImage) payload.image_path = null;
      if(editing.pendingImageFile){
        const ext = (editing.pendingImageFile.name || "photo.jpg").split(".").pop() || "jpg";
        payload.image_path = await uploadMedia(editing.pendingImageFile, "articles/images", ext);
      }
      if(editing.removeAudio) payload.audio_path = null;
      if(editing.pendingAudioBlob){
        const isFile = editing.pendingAudioBlob instanceof File;
        const ext = isFile ? (editing.pendingAudioBlob.name.split(".").pop() || "webm") : "webm";
        payload.audio_path = await uploadMedia(editing.pendingAudioBlob, "articles/audio", ext);
      }

      let error;
      if(d.id){
        ({ error } = await sb.from("articles").update(payload).eq("id", d.id));
      } else {
        payload.created_by = state.session.user.id;
        ({ error } = await sb.from("articles").insert(payload));
      }
      if(error) throw error;

      state.editing = null;
      await loadData();
    }catch(err){
      msg.textContent = "Не удалось сохранить: " + err.message; msg.className = "form-msg error";
      $("#ed-save").disabled = false;
    }
  });
}

/* ---------------------------- helpers ---------------------------- */
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
}
function escapeAttr(s){ return escapeHtml(s); }
function formatDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  return d.toLocaleDateString("ru-RU", { day:"2-digit", month:"long", year:"numeric" });
}

/* ---------------------------- boot ---------------------------- */
(async function boot(){
  const { data } = await sb.auth.getSession();
  if(data.session){ await onLoggedIn(data.session); }
})();
</script>
